[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "tether"
version = "0.1.0"
description = "jj-style version control for heterogeneous datasets (files, Icechunk, Neon, Iceberg, git)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "tether contributors" }]
keywords = [
    "version-control",
    "data-versioning",
    "icechunk",
    "iceberg",
    "neon",
    "jujutsu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = ["tomlkit>=0.12"]

[project.optional-dependencies]
cli = ["typer>=0.12"]
s3 = ["boto3>=1.34"]
icechunk = ["icechunk>=1.0"]
neon = ["httpx>=0.27", "psycopg[binary]>=3.1"]
iceberg = ["pyiceberg>=0.10", "pyarrow>=15"]
all = [
    "typer>=0.12",
    "boto3>=1.34",
    "icechunk>=1.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pyiceberg>=0.10",
    "pyarrow>=15",
]

[project.scripts]
tether = "tether.cli:main"

[project.urls]
Homepage = "https://github.com/tether-vcs/tether"
Repository = "https://github.com/tether-vcs/tether"
Changelog = "https://github.com/tether-vcs/tether/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3]>=5",
    "respx>=0.21",
    "icechunk>=1.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer's idiom requires calling Option()/Argument() in parameter defaults.
"src/tether/cli.py" = ["B008"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
