[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
# Distribution name; the import package and CLI are still `tether` (PyPI
# prohibits the bare name `tether`).
name = "tether-vcs"
# PEP 440 pre-release: installers only select it when no final release exists
# or when asked (`pip install --pre` / an explicit `==0.1.0a1`).
version = "0.1.0a8"
description = "jj-style version control for heterogeneous datasets (files/object stores, Icechunk, Neon, Iceberg, Delta, Lance, lakeFS, DuckLake, Dolt, git)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "tether contributors" }]
keywords = [
    "version-control",
    "data-versioning",
    "icechunk",
    "iceberg",
    "neon",
    "delta-lake",
    "lance",
    "lakefs",
    "ducklake",
    "dolt",
    "jujutsu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = ["tomlkit>=0.12"]

[project.optional-dependencies]
cli = ["typer>=0.12"]
# One Rust-backed object-store client covers S3, GCS, and Azure Blob for the
# `file` backend; the per-cloud extras are aliases so intent reads clearly.
objectstore = ["obstore>=0.11"]
s3 = ["obstore>=0.11"]
gcs = ["obstore>=0.11"]
azure = ["obstore>=0.11"]
icechunk = ["icechunk>=1.0"]
neon = ["httpx>=0.27", "psycopg[binary]>=3.1"]
postgres = ["psycopg[binary]>=3.1"]
iceberg = ["pyiceberg>=0.10", "pyarrow>=15"]
delta = ["deltalake>=1.0"]
lance = ["pylance>=1.0"]
lakefs = ["lakefs>=0.8"]
ducklake = ["duckdb>=1.3"]
dolt = ["pymysql>=1.1"]
all = [
    "typer>=0.12",
    "obstore>=0.11",
    "icechunk>=1.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pyiceberg>=0.10",
    "pyarrow>=15",
    "deltalake>=1.0",
    "pylance>=1.0",
    "lakefs>=0.8",
    "duckdb>=1.3",
    "pymysql>=1.1",
]

[project.scripts]
tether = "tether.cli:main"

[project.urls]
Homepage = "https://evanlyall.com/tether/"
Documentation = "https://evanlyall.com/tether/"
Repository = "https://github.com/elyall/tether"
Changelog = "https://github.com/elyall/tether/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "pytest-postgresql>=6.1",  # ephemeral cluster for publish/import tests
    "icechunk>=1.0",
    "pyarrow>=15",
]
# Documentation site (Great Docs on Quarto). `quarto-cli` pins the Quarto
# binary alongside the Python deps so local and CI builds match.
docs = [
    "great-docs>=0.17",
    "quarto-cli>=1.7",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "tether"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer's idiom requires calling Option()/Argument() in parameter defaults.
"src/tether/cli.py" = ["B008"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["tether"]
branch = true
# The Click mirror of the CLI exists for the docs build, not for callers.
omit = ["src/tether/_clickdoc.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

