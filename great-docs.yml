# Great Docs configuration for tether.
# https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Only settings that differ from the defaults are listed. `great-docs build`
# renders the site into great-docs/_site (the great-docs/ directory is
# ephemeral and gitignored); `great-docs preview` serves it locally.

display_name: tether
module: tether  # the distribution is `tether-vcs`; the importable package is `tether`
parser: google
dynamic: true
repo: https://github.com/elyall/tether
# Project Pages are served under the account's custom domain, so the canonical
# base must be set explicitly (it would otherwise derive elyall.github.io).
site_url: https://evanlyall.com/tether/
seo:
  canonical:
    base_url: https://evanlyall.com/tether/

# Narrative docs live in user_guide/ (numeric prefixes order the sidebar).
homepage: index
navbar_order:
  - User Guide
  - Reference
  - Changelog

# CLI reference is generated from the Typer app, mirrored onto real Click
# objects by tether._clickdoc (Typer vendors its own Click).
cli:
  enabled: true
  module: tether._clickdoc
  name: click_app
  title: CLI
  desc: >-
    The `tether` command (installed by the `cli` extra). Every command that
    prints a result accepts `--json`; see the CLI guide for output shapes,
    exit codes, and environment variables.
  sections:
    - title: Dataset
      desc: Create a dataset and manage its objects.
      contents: [init, add, remove]
    - title: Inspect
      desc: Fingerprint, classify, compare, browse history, and verify.
      contents: [status, snapshot, diff, log, verify]
    - title: Record and branch
      desc: Pin state into commits and fork writable branches.
      contents: [commit, new, open, promote]
    - title: Maintenance
      contents: [gc]
    - title: Registries
      desc: "Experimental: derive SQL tables from history, push them to Postgres, or import the object set from a registry."
      contents: [export, publish, import]

# Releases are not published yet; enable once GitHub Releases exist.
changelog:
  enabled: false

reference:
  title: API Reference
  desc: >-
    The Python API. `Repo` is the entry point; everything the CLI does is a
    thin wrapper over it. Backend-specific behavior (locators, config, state,
    handles) is described in the backends guide.
  sections:
    - title: Repository
      desc: The engine and the results it returns.
      contents:
        - Repo
        - StatusReport
        - ObjectStatus
        - CommitResult
        - GcReport
        - PromoteReport
        - DiffEntry
        - TETHER_REV_ENV
    - title: Plans
      desc: >-
        What a store-writing command would do, as data. `Repo.plan_*` returns a
        `Plan`; `Repo.apply_*` executes one after re-checking the world matches.
      contents:
        - Plan
        - Action
    - title: Manifest model
      desc: >-
        What is committed to the VCS (`tether.toml`, `.tether/objects/*.toml`)
        and kept untracked (`.tether/workspace.toml`), plus the hashing and
        naming helpers behind pin ids and refs.
      contents:
        - RepoConfig
        - Policy
        - Pin
        - ObjectManifest
        - WorkspaceState
        - compute_pin_id
        - ref_for_pin
        - working_ref_name
        - working_ref_workspace
        - listing_name
        - manifest_hash
    - title: Handles
      desc: Typed native handles returned by `Repo.open`.
      contents:
        - handles
    - title: Backend protocol
      desc: >-
        Implement `ObjectBackend` and register it to add a system; capability
        flags decide which commands apply.
      contents:
        - backends
    - title: Conformance suite
      desc: Capability-parametrized checks for backend authors.
      contents:
        - testing
    - title: Registries
      desc: >-
        Export tables (`ExportBundle`, `TABLES`), Postgres publishing, and the
        canonical import columns / sources for `import`.
      contents:
        - export
        - registry
        - ImportReport
    - title: VCS adapters
      desc: How tether reads and writes history through jj or git.
      contents:
        - vcs
    - title: Errors
      contents:
        - TetherError
        - ConfigError
        - VcsError
        - BackendError
        - CapabilityError
        - ImmutableObjectModified
        - UnpinnedStateError
        - PinDriftError
        - StaleWorkingCopyError
        - StalePlanError
        - MergeConflict
        - MultiObjectError

skill:
  gotchas:
    - "Run `tether new` before writing: writable handles are refused while the workspace is stale or has no working ref. Forks are lazy: the first writable `open` creates the branch (`--eager` creates them during `new`; `--pin record` objects always fork during `new`)."
    - "A `file` object is Observed unless registered with `--file versioned` on a versioning-enabled bucket; its committed state cannot be re-read later."
    - "Neon pins are child branches: a working branch cannot be deleted while its pins exist, and `commit` refuses while writers are active (`--force` overrides)."
    - "A DuckDB-file DuckLake catalog can be attached once per process; close `DuckLakeHandle`s before `status`."
    - "`tether gc` never deletes branches on its own; `--prune-workspaces` keeps every live jj workspace / git worktree automatically, deletes stray `tether.ws.*` branches only when their head is pinned or untouched, and `--force-prune` deletes the rest along with any unpinned data on them."
  best_practices:
    - "Set `TETHER_REV` in reproducible jobs so `repo.open(key)` resolves read-only at that commit's pins."
    - "Use `--write track` for production branches that must not be forked (e.g. Neon `main`)."
    - "`tether promote` only fast-forwards a base branch that is unchanged since the fork point; a moved base needs a backend with `MERGE` (lakeFS, Dolt, git) or a manual re-apply -- Icechunk/Iceberg refuse, Lance/Neon cannot promote at all."
    - "Run `tether verify --all-history --deep` before `tether gc --no-dry-run`."
    - "Preview store writes with `--dry-run` on `commit`, `new`, and `gc`; save with `--plan FILE` and apply with `--from-plan FILE` when a review step is needed."
    - "Use `--pin record` on scratch objects when only the branch heads matter; it skips the native ref per commit and forks from the recorded state."
    - "For registries, run `tether publish` after each `tether commit` (or `tether export` for a file); join `objects.uri` to the catalog's URI column and `objects.commit_id` to whatever column records the VCS commit a job read. `tether import` only changes what is tracked; commit afterwards."
