# Great Docs configuration for tether.
# https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Only settings that differ from the defaults are listed. `great-docs build`
# renders the site into great-docs/_site (the great-docs/ directory is
# ephemeral and gitignored); `great-docs preview` serves it locally.

display_name: tether
module: tether  # the distribution is `tether-vcs`; the importable package is `tether`
parser: google
dynamic: true
repo: https://github.com/elyall/tether
# Project Pages are served under the account's custom domain, so the canonical
# base must be set explicitly (it would otherwise derive elyall.github.io).
site_url: https://evanlyall.com/tether/
seo:
  canonical:
    base_url: https://evanlyall.com/tether/

# Narrative docs live in user_guide/ (numeric prefixes order the sidebar).
homepage: index
navbar_order:
  - User Guide
  - Reference
  - Changelog

# CLI reference is generated from the Typer app, mirrored onto real Click
# objects by tether._clickdoc (Typer vendors its own Click).
cli:
  enabled: true
  module: tether._clickdoc
  name: click_app
  title: CLI
  desc: >-
    The `tether` command (installed by the `cli` extra). Every command that
    prints a result accepts `--json`; see the CLI guide for output shapes,
    exit codes, and environment variables.
  sections:
    - title: Dataset
      desc: Create a dataset and manage its objects.
      contents: [init, add, set, remove]
    - title: Inspect
      desc: Fingerprint, classify, compare, browse history, and verify.
      contents: [status, snapshot, diff, log, verify]
    - title: Record and branch
      desc: Pin state into commits and fork writable branches.
      contents: [commit, pull, new, open, restore, promote]
    - title: Maintenance
      desc: Reclaim native refs, and see or reverse what tether did.
      contents: [gc, abandon, forget-workspace, ops, undo, repair, upgrade]
    - title: Registries
      desc: "Experimental: derive SQL tables from history, push them to Postgres, or import the object set from a registry."
      contents: [export, publish, import]

# Releases are not published yet; enable once GitHub Releases exist.
changelog:
  enabled: false

reference:
  title: API Reference
  desc: >-
    The Python API. `Repo` is the entry point; everything the CLI does is a
    thin wrapper over it. Backend-specific behavior (locators, config, state,
    handles) is described in the backends guide.
  sections:
    - title: Repository
      desc: The engine and the results it returns.
      contents:
        - Repo
        - StatusReport
        - ObjectStatus
        - VcsDrift
        - CommitResult
        - GcReport
        - AbandonReport
        - ForgetWorkspaceReport
        - PullReport
        - SetReport
        - PromoteReport
        - UndoReport
        - UndoToReport
        - RepairReport
        - UpgradeReport
        - DiffEntry
        - TETHER_REV_ENV
    - title: Operation log
      desc: What tether did to the stores, per workspace; what undo works from.
      contents:
        - OpEntry
        - oplog
    - title: Migrations
      desc: Stacked upgrades behind `tether upgrade`; append a `Migration` when the format changes.
      contents:
        - migrations
    - title: Plans
      desc: >-
        What a store-writing command would do, as data. `Repo.plan_*` returns a
        `Plan`; `Repo.apply_*` executes one after re-checking the world matches.
      contents:
        - Plan
        - Action
    - title: Manifest model
      desc: >-
        What is committed to the VCS (`tether.toml`, `.tether/objects/*.toml`)
        and kept untracked (`.tether/workspace.toml`), plus the hashing and
        naming helpers behind pin ids and refs.
      contents:
        - RepoConfig
        - Policy
        - Pin
        - ObjectManifest
        - WorkspaceState
        - compute_pin_id
        - ref_for_pin
        - working_ref_name
        - working_ref_workspace
        - listing_name
        - manifest_hash
    - title: Handles
      desc: Typed native handles returned by `Repo.open`.
      contents:
        - handles
    - title: Backend protocol
      desc: >-
        Implement `ObjectBackend` and register it to add a system; capability
        flags decide which commands apply.
      contents:
        - backends
    - title: Conformance suite
      desc: Capability-parametrized checks for backend authors.
      contents:
        - testing
    - title: Registries
      desc: >-
        Export tables (`ExportBundle`, `TABLES`), Postgres publishing, and the
        canonical import columns / sources for `import`.
      contents:
        - export
        - registry
        - ImportReport
    - title: VCS adapters
      desc: How tether reads and writes history through jj or git.
      contents:
        - vcs
    - title: Errors
      contents:
        - TetherError
        - ConfigError
        - VcsError
        - BackendError
        - CapabilityError
        - ImmutableObjectModified
        - UnpinnedStateError
        - PinDriftError
        - StaleWorkingCopyError
        - StalePlanError
        - MergeConflict
        - MultiObjectError

skill:
  gotchas:
    - "A dataset bookmark stands for a branch in every system. The trunk (`main`, `[vcs] trunk`) stands for each object's upstream branch: working on it writes there. `tether new -b NAME` starts a bookmark whose branch in each system is `tether.ws.<dataset>.NAME`, forked on first write. A working copy on no bookmark is read-only: `open --rev`, `status`, `verify` work; writes need a bookmark."
    - "`tether status` is local by default and shows the last snapshot with its age; `tether status --snapshot` (or `tether snapshot`) fingerprints every object. `verify` always fingerprints; `commit` fingerprints the bookmark's branches only; objects with no branch keep their pin."
    - "`tether commit` moves the bookmark onto the new commit (one jj operation, so `jj undo` takes both back) and leaves the store branches where they are -- it is not `jj commit`, nothing new is forked. It refuses when the VCS working copy has left the bookmark; `status` says how to return."
    - "`tether pull` is the fetch: on the trunk it reads every object's upstream branch and every branch-less object (tables, directories) and commits what moved onto `main`. It works only on the bookmark you are on (`tether new NAME` first) and refuses uncommitted manifest edits."
    - "Run `tether new` before writing: writable handles are refused while the workspace is stale or has no working ref. Forks are lazy: the first writable `open` creates the branch (`--eager` creates them during `new`; `--pin record` objects always fork during `new`)."
    - "A bookmark another live checkout works on is refused by `tether new NAME` unless `--shared`; the trunk is shared by nature."
    - "A `file` object is Observed unless registered with `--file versioned` on a versioning-enabled bucket; its committed state cannot be re-read later."
    - "Neon pins are child branches: a working branch cannot be deleted while its pins exist, and `commit` refuses while writers are active (`--force` overrides)."
    - "A DuckDB-file DuckLake catalog can be attached once per process; close `DuckLakeHandle`s before `status`."
    - "`tether gc` never deletes branches on its own; `--prune-bookmarks` keeps every bookmark the VCS has or a live checkout works on (`--keep-bookmark` for one that lives elsewhere), deletes stray `tether.ws.*` branches only when their head is pinned or untouched, and `--force-prune` deletes the rest along with any unpinned data on them -- except a branch the store refuses to delete (Neon: pins hang off it), which is planned as kept with the reason. `forget-workspace` never touches branches."
    - "`tether new` refuses to reset a working branch that holds writes you never committed; commit them or pass `--discard`. A branch already sitting at the pin is reused, not re-forked."
    - "`jj undo` / `git reset` move the manifests, never the stores. `tether undo` reverses tether's own operations from its op log (`tether ops`); `tether repair` recreates pins and branches the manifests still name. `status` warns when a dataset commit vanished from the VCS behind tether's back, and when the bookmark was deleted, renamed, moved, or left."
    - "A tether command exists where an operation has a VCS half and a store half (`commit`, `new`, `pull`, `promote`, `restore`, `abandon`, `forget-workspace`); everything that only touches files and history is jj/git's. Run `tether status` after any VCS operation that moved the working copy or a bookmark, and `tether new` before writing again."
  best_practices:
    - "Set `TETHER_REV` in reproducible jobs so `repo.open(key)` resolves read-only at that commit's pins."
    - "Production databases that must receive writes on `main` (e.g. Neon, which cannot promote a child branch) are written on the trunk bookmark: `tether new main`."
    - "`tether promote` lands the bookmark: each system's upstream branch fast-forwards to the bookmark's branch when unchanged since the fork point (a moved upstream needs a backend with `MERGE` -- lakeFS, Dolt, git -- or a manual re-apply; Icechunk/Iceberg refuse, Lance/Neon cannot promote at all), and when everything fast-forwarded the trunk bookmark moves to the commit."
    - "Run `tether verify --all-history --deep` before `tether gc --no-dry-run`."
    - "Preview store writes with `--dry-run` on every command that makes them (`commit`, `new`, `gc`, `promote`, `restore`, `import`, `repair`, `upgrade`, `forget-workspace`); save with `--plan FILE` and apply with `--from-plan FILE` when a review step is needed."
    - "Retire a losing bookmark in this order: `tether forget-workspace` its checkout, `tether abandon --gc` its commit, `jj bookmark delete` it, `tether gc --prune-bookmarks` its branches (delete the bookmark before the abandon and gc sees pinned heads, needing no `--force-prune`)."
    - "Datasets from before 0.1.0a8 need `tether upgrade` (`--dry-run` first): it renames every pin and branch into the dataset's namespace and rewrites history to match, so every clone must re-sync afterwards. The v3 migration (content-hashed file states; the `write` policy line dropped) touches only the working tree."
    - "To hold an input still under a long analysis, work on a bookmark and do not write to it: it keeps its pin. To trail the world, run `tether pull` on `main`."
    - "Use `--pin record` on scratch objects when only the branch heads matter; it skips the native ref per commit and forks from the recorded state."
    - "For registries, run `tether publish` after each `tether commit` (or `tether export` for a file); join `objects.uri` to the catalog's URI column and `objects.commit_id` to whatever column records the VCS commit a job read. `tether import` only changes what is tracked; commit afterwards."
