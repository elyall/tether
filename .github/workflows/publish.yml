name: Publish

on:
  release:
    types: [published]

jobs:
  # The release commit must pass the same gates as any other commit before a
  # wheel goes out: a release made from a red tree is a broken package.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jj
        env:
          JJ_VERSION: v0.45.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/jj.tar.gz -C /tmp ./jj
          sudo install -m 0755 /tmp/jj /usr/local/bin/jj
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -q

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no long-lived tokens
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Tag matches the package version
        run: |
          set -euo pipefail
          version="$(uv run --no-project python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "release tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          }
      - name: Smoke-test the wheel
        # Install the built wheel into a clean environment (no source tree on
        # the path) and exercise the entry point and a full init/add/commit.
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "$(ls dist/*.whl)[cli]"
          cd /tmp
          /tmp/smoke/bin/tether --version
          git init -q smoke-ds && cd smoke-ds
          # tether commits through git; the runner has no identity configured.
          git config user.email ci@example.com
          git config user.name ci
          git commit -q --allow-empty -m init
          /tmp/smoke/bin/tether init
          printf 'hello\n' > data.txt
          /tmp/smoke/bin/tether add raw data.txt --kind file
          /tmp/smoke/bin/tether commit -m "smoke"
          /tmp/smoke/bin/tether status
      - name: Publish to PyPI
        run: uv publish
