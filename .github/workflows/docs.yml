name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The `docs` dependency group pins great-docs and quarto-cli (the Quarto
      # binary) in uv.lock, so local and CI builds use identical versions and
      # no separate Quarto setup step is needed. All extras are installed so
      # every backend module (and the Typer CLI) can be introspected.
      - name: Install package and dependencies
        run: uv sync --all-extras --group docs --python 3.11

      - name: Build docs
        run: uv run great-docs build

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      # Upload the Pages artifact here, once per run. Uploading it in the
      # publish job means every re-run adds another "github-pages" artifact and
      # deploy-pages then fails with "Multiple artifacts ... found".
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: uv run great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: "Preview Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # Post (and keep updated) a sticky PR comment with the local-preview
      # command, pinned to this run so it reproduces the build under review.
      # Runs the released great-docs via pipx (no install step needed); kept as
      # its own minimal job so the docs build never holds a pull-requests:write
      # token. continue-on-error so fork PRs (read-only token) don't fail the run.
      - name: Post preview instructions to the PR
        continue-on-error: true
        run: pipx run great-docs ci pr-comment --run ${{ github.run_id }} --pr ${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
